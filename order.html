<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Мой заказ — Пивка для рывка</title><meta name="theme-color" content="#080a0b">
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0b;color:#fff;font:15px system-ui,-apple-system,sans-serif}a{color:inherit}
.app{max-width:560px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 40px}
.logo{font-weight:1000;font-size:20px;line-height:.9;text-transform:uppercase;text-decoration:none;display:inline-block;margin-bottom:14px}.logo b{color:#ffb51b}
h1{font-size:26px;margin:0 0 2px}.muted{color:#a9afb3;font-size:13px}
.card{background:#14181a;border:1px solid #272d30;border-radius:16px;padding:13px 14px;margin:12px 0}
.card h2{font-size:14px;margin:0 0 8px;color:#ffcf6b;text-transform:uppercase;letter-spacing:.04em}
.track{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.track li{display:grid;grid-template-columns:14px 1fr auto;gap:9px;align-items:center;color:#6f777b}
.track li i{width:12px;height:12px;border-radius:50%;border:2px solid #3a4145}
.track li time{font-size:12px;color:#8b9296}
.track li.done{color:#d9dde0}.track li.done i{background:#22a447;border-color:#22a447}
.track li.now{color:#fff;font-weight:900}.track li.now i{background:#ffb51b;border-color:#ffb51b;box-shadow:0 0 0 4px #ffb51b33}
.track li.cancel{color:#ff7878;font-weight:900}.track li.cancel i{background:#ff7878;border-color:#ff7878}
.line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid #23292c}.line:first-of-type{border-top:0}
.line span{overflow-wrap:anywhere}.line b{white-space:nowrap}
.sum{display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin-top:6px}
.btn{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:13px;font-weight:900;margin-top:10px}
.yellow{background:#ffb51b;color:#171000}.wa{background:#22a447;color:#fff}.ghost{border:1px dashed #3a4145;color:#ffcf6b;font-weight:800}
.err{color:#ff7878;margin:16px 0}
.ryvokCard{margin-top:12px;border:1px solid rgba(255,181,27,.4);background:linear-gradient(90deg,rgba(255,181,27,.16),rgba(255,181,27,.04));border-radius:16px;padding:12px 14px;display:grid;gap:3px;font-size:13px;color:#e6e8ea}.ryvokCard>b{color:#ffb51b;font-size:16px}.ryvokCard .ryvokPrize{color:#fff;font-weight:900}
.ryvokPlay{display:block;margin-top:6px;text-align:center;background:#ffb51b;color:#171000;border-radius:12px;padding:12px;font-weight:1000;text-decoration:none}
</style></head><body>
<main class="app">
<a class="logo" href="./"><span>Пивка</span><br><b>для рывка</b></a>
<h1 id="title">Мой заказ</h1>
<div class="muted" id="sub">Загрузка…</div>
<div id="box"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./js/track.js?v=20261007b"></script>
<script>
// The order's own page: the link is on the success screen and in the order card on the home page, so the order can
// always be found again — from any browser, even after the phone forgot the site. Access = the random order id.
'use strict';
const ORDER = new URLSearchParams(location.search).get('o') || '';
const sb = window.supabase.createClient(PIVKA_CONFIG.supabaseUrl, PIVKA_CONFIG.supabaseAnonKey);
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Number(n || 0).toFixed(2).replace('.00', '') + ' ₾';
const UNITS = { ru: [' л', ' шт'], ka: [' ლ', ' ც'], hy: [' լ', ' հատ'] };
const unit = (q, u) => Number(q) + (UNITS[document.documentElement.lang] || UNITS.ru)[u === 'liter' ? 0 : 1];
const FINAL = ['DELIVERED', 'CANCELLED', 'REFUNDED'];
let timer = 0, tick = 0;

async function load() {
  clearTimeout(timer);
  if (!/^[0-9a-f-]{36}$/i.test(ORDER)) return fail('Ссылка на заказ неполная');
  try {
    const [t, v] = await Promise.all([sb.rpc('order_track', { p_order: ORDER }), sb.rpc('order_edit', { p_order: ORDER })]);
    if (t.error) throw t.error;
    if (!t.data) return fail('Заказ не найден');
    const o = t.data; o._at = Date.now();
    // This phone remembers the order again (the home page shows its status card).
    try { localStorage.setItem('pivka_last_order', JSON.stringify({ id: ORDER, n: o.order_number, at: Date.now() })) } catch (e) {}
    render(o, v.data);
    if (!FINAL.includes(o.status)) timer = setTimeout(load, 20e3);
  } catch (e) {
    $('sub').textContent = 'Нет связи — обновим через 30 секунд';
    timer = setTimeout(load, 30e3);
  }
}
function fail(msg) {
  $('sub').textContent = '';
  $('box').innerHTML = '<div class="err">' + esc(msg) + '</div><a class="btn ghost" href="./">← В магазин</a>';
}
function render(o, v) {
  clearTimeout(tick);
  $('title').textContent = 'Заказ №' + o.order_number;
  $('sub').textContent = new Date(o.created_at).toLocaleString('ru-RU', { timeZone: 'Asia/Tbilisi', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  let h = '<div class="card"><h2>Статус</h2><ol class="track">' +
    trackSteps(o).map(s => '<li class="' + s[2] + '"><i></i><span>' + esc(s[0]) + '</span><time>' + trackTime(s[1]) + '</time></li>').join('') + '</ol></div>';
  if (v) {
    const lines = [];
    if (v.bundle) lines.push('<div class="line"><span><span>🔥 Рывок:</span> ' + v.bundle.items.map(i => esc(i.name) + ' × ' + unit(i.qty, i.unit)).join(', ') + '</span><b>' + money(v.bundle.total) + '</b></div>');
    v.items.forEach(i => lines.push('<div class="line"><span>' + esc(i.name) + ' × ' + unit(i.qty, i.unit) + '</span><b>' + money(i.price * i.qty) + '</b></div>'));
    v.gifts.forEach(g => lines.push('<div class="line"><span>🎁 ' + esc(g.name) + ' × ' + unit(g.qty, g.unit) + '</span><b>0 ₾</b></div>'));
    if (Number(v.discount) > 0) lines.push('<div class="line"><span>Скидка рывка</span><b>−' + money(v.discount) + '</b></div>');
    if (o.fulfillment === 'delivery') lines.push('<div class="line"><span>Доставка</span><b>' + money(v.delivery_fee) + '</b></div>');
    h += '<div class="card"><h2>Что заказано</h2>' + lines.join('') + '<div class="sum"><span>Итого</span><span>' + money(v.total) + '</span></div></div>';
  }
  if (o.status === 'NEW') h += '<a class="btn yellow" href="./edit.html?o=' + encodeURIComponent(ORDER) + '">✏️ Изменить заказ</a>';
  // Nobody has confirmed the order yet — the customer can still cancel it. After «Принят» — only by writing to us in the chat.
  if (o.status === 'NEW') h += '<button class="btn ghost" id="cancelOrder" type="button" style="width:100%;background:none;cursor:pointer">❌ Отменить заказ</button>';
  h += '<div class="ryvokSlot"></div>';   // «Рывок» game, once the courier pressed «Еду»
  h += '<button type="button" class="btn wa" data-chat style="width:100%;border:0;cursor:pointer">💬 Написать нам в чат</button>' +
    '<a class="btn ghost" href="./">← В магазин</a>';
  $('box').innerHTML = h;
  if (ryvokEligible(o)) ryvokState(ORDER).then(g => { const slot = $('box').querySelector('.ryvokSlot'); if (slot) slot.innerHTML = ryvokBlock(ORDER, g, document.documentElement.lang || 'ru') });
  const cancelBtn = $('cancelOrder');
  if (cancelBtn) cancelBtn.onclick = cancelOrder;
  if (o.status === 'OUT_FOR_DELIVERY' && o.fulfillment !== 'pickup' && o.ready_at) {   // «Собран» → «Едет» on time
    const left = new Date(o.ready_at).getTime() + 30e3 - trackNow(o);
    if (left > 0) tick = setTimeout(() => render(o, v), left + 300);
  }
}
async function cancelOrder() {
  const t = (x) => window.PIVKA_I18N ? PIVKA_I18N.translate(x, PIVKA_I18N.language) : x;
  if (!confirm(t('Отменить заказ? Курьер и магазин сразу увидят отмену.'))) return;
  const btn = $('cancelOrder'); btn.disabled = true;
  try {
    const r = await sb.rpc('order_cancel_by_customer', { p_order: ORDER });
    if (r.error) throw r.error;
    if (r.data && r.data.error === 'state') alert(t('Заказ уже принят — отменить можно, написав нам в чат.'));
  } catch (e) { alert(t('Не получилось отменить. Напишите нам в чат.')) }
  load();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load() });
window.setLang = l => { document.documentElement.lang = l };
load();
</script>
<script src="./js/i18n.js?v=20261007l"></script><script src="./js/chat.js?v=20261007b"></script>
<script>
(() => { let l = 'ru'; try { l = localStorage.getItem('pivka_lang') || (navigator.language || '').slice(0, 2) } catch (e) {} setLang(['ru', 'ka', 'hy'].includes(l) ? l : 'ru') })();
</script>
</body></html>
