<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пивка — Админ</title><style>body{font-family:system-ui;background:#11100c;color:#fff;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#201d14;border:1px solid #4a4334;border-radius:16px;padding:18px;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #555}button{background:#ffb000;font-weight:800}.muted{color:#bcb3a2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{background:#2a261b;border-radius:12px;padding:14px}.metric b{font-size:24px;color:#ffb000}</style></head><body><main class="wrap"><h1>Пивка для рывка — Админ</h1><div id="setup" class="card"><b>Phase 1 foundation</b><p class="muted">Подключите Supabase URL и anon key в config.js. До подключения production main не затрагивается.</p></div><div class="card"><h2>Вход</h2><input id="email" type="email" placeholder="Email"> <input id="password" type="password" placeholder="Пароль"> <button onclick="login()">Войти</button><p id="msg" class="muted"></p></div><div class="grid"><div class="metric">Продажи сегодня<br><b>—</b></div><div class="metric">Заказы<br><b>—</b></div><div class="metric">Прибыль<br><b>—</b></div><div class="metric">Низкие остатки<br><b>—</b></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../js/db.js"></script><script>async function login(){var m=document.getElementById('msg');try{await PivkaDB.signIn(document.getElementById('email').value,document.getElementById('password').value);m.textContent='Вход выполнен. Следующий шаг — рабочие разделы админки.'}catch(e){m.textContent=e.message}}</script></body></html>
