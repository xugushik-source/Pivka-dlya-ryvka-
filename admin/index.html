<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пивка — управление</title><style>
*{box-sizing:border-box}body{font:14px system-ui;background:#0b0d0e;color:#fff;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:1000}.logo b,.num{color:#ffb51b}.card{background:#15191b;border:1px solid #293034;border-radius:16px;padding:16px;margin:12px 0}input,button,select{font:inherit;padding:11px;border-radius:10px;border:1px solid #394145;background:#0e1112;color:#fff}button.primary{background:#ffb51b;color:#111;font-weight:900;border:0}.muted{color:#9fa6aa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#171c1e;border:1px solid #293034;border-radius:14px;padding:14px}.metric b{display:block;font-size:25px;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{white-space:nowrap}.tab.on{background:#ffb51b;color:#111;font-weight:900}.row{display:grid;grid-template-columns:1.3fr .8fr .7fr .7fr auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid #282e31}.pill{padding:5px 8px;border-radius:20px;background:#252b2e;font-size:12px}.hidden{display:none}.login{max-width:500px;margin:80px auto}.product{grid-template-columns:1.5fr .6fr .6fr .6fr auto}.product input{width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.row,.product{grid-template-columns:1fr 1fr}.row>*:first-child{grid-column:1/-1}.wrap{padding:13px}}</style></head><body><main class="wrap">
<section id="loginBox" class="card login"><div class="logo">Пивка <b>для рывка</b></div><h2>Вход владельца</h2><input id="email" type="email" placeholder="Email"> <input id="password" type="password" placeholder="Пароль"><button class="primary" onclick="login()">Войти</button><p id="msg" class="muted"></p></section>
<section id="app" class="hidden"><div class="head"><div><div class="logo">Пивка <b>для рывка</b></div><span class="muted">Панель управления</span></div><button onclick="logout()">Выйти</button></div>
<div class="grid"><div class="metric">Продажи сегодня<b id="sales">0 ₾</b></div><div class="metric">Заказы<b id="ordersCount">0</b></div><div class="metric">Валовая прибыль<b id="profit">0 ₾</b></div><div class="metric">Низкие остатки<b id="lowStock">0</b></div></div>
<div class="tabs"><button class="tab on" onclick="showTab('orders',this)">Заказы</button><button class="tab" onclick="showTab('products',this)">Товары и остатки</button></div>
<div id="ordersTab" class="card"><h2>Последние заказы</h2><div id="ordersList" class="muted">Загрузка…</div></div>
<div id="productsTab" class="card hidden"><h2>Товары</h2><p class="muted">Цена, закупка и остаток меняются прямо здесь.</p><div id="productsList">Загрузка…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../js/db.js"></script><script>
const c=()=>PIVKA_DB.client(),money=n=>Number(n||0).toFixed(2).replace('.00','')+' ₾';
async function login(){try{await PIVKA_DB.signIn(email.value,password.value);await start()}catch(e){msg.textContent=e.message}}
async function logout(){await PIVKA_DB.signOut();location.reload()}
function showTab(n,b){ordersTab.classList.toggle('hidden',n!=='orders');productsTab.classList.toggle('hidden',n!=='products');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
async function start(){const u=await c().auth.getUser();if(!u.data.user)return;loginBox.classList.add('hidden');app.classList.remove('hidden');await Promise.all([loadOrders(),loadProducts()])}
async function loadOrders(){const r=await c().from('orders').select('id,order_number,status,total,cogs_total,gross_profit,fulfillment_type,created_at,customers(full_name,phone)').order('created_at',{ascending:false}).limit(50);if(r.error){ordersList.textContent=r.error.message;return}const rows=r.data||[],today=new Date().toDateString(),tod=rows.filter(x=>new Date(x.created_at).toDateString()===today);sales.textContent=money(tod.reduce((s,x)=>s+Number(x.total),0));profit.textContent=money(tod.reduce((s,x)=>s+Number(x.gross_profit),0));ordersCount.textContent=tod.length;ordersList.innerHTML=rows.length?rows.map(o=>`<div class="row"><div><b>№${o.order_number}</b> · ${o.customers?.full_name||o.customers?.phone||'Клиент'}<div class="muted">${new Date(o.created_at).toLocaleString('ru')}</div></div><b>${money(o.total)}</b><span>${o.fulfillment_type==='delivery'?'Доставка':'Самовывоз'}</span><span class="pill">${o.status}</span><select onchange="statusOrder('${o.id}',this.value)"><option>NEW</option><option>CONFIRMED</option><option>PREPARING</option><option>OUT_FOR_DELIVERY</option><option>DELIVERED</option><option>CANCELLED</option></select></div>`).join(''):'Заказов пока нет'}
async function statusOrder(id,status){const r=await c().from('orders').update({status}).eq('id',id);if(r.error)alert(r.error.message);else loadOrders()}
async function loadProducts(){const r=await c().from('products').select('id,name,sku,sale_price,purchase_price,stock_quantity,active').order('sort_order');if(r.error){productsList.textContent=r.error.message;return}const rows=r.data||[];lowStock.textContent=rows.filter(x=>Number(x.stock_quantity)<=5).length;productsList.innerHTML=rows.map(p=>`<div class="row product"><div><b>${p.name}</b><div class="muted">${p.sku}</div></div><input id="sp-${p.id}" type="number" step=".01" value="${p.sale_price}" title="Цена"><input id="cp-${p.id}" type="number" step=".01" value="${p.purchase_price}" title="Закупка"><input id="st-${p.id}" type="number" step=".01" value="${p.stock_quantity}" title="Остаток"><button class="primary" onclick="saveProduct('${p.id}')">Сохранить</button></div>`).join('')}
async function saveProduct(id){const r=await c().from('products').update({sale_price:+document.getElementById('sp-'+id).value,purchase_price:+document.getElementById('cp-'+id).value,stock_quantity:+document.getElementById('st-'+id).value}).eq('id',id);if(r.error)alert(r.error.message);else loadProducts()}
c().auth.onAuthStateChange((e,s)=>{if(s?.user)start()});start();
</script></body></html>
