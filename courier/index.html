<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пивка — Курьер</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><style>body{margin:0;background:#0d0d0f;color:#fff;font:16px system-ui;padding:16px}h1{font-size:24px}.card{background:#19191d;border:1px solid #303036;border-radius:18px;padding:16px;margin:12px 0}.muted{color:#aaa}.big{font-size:22px;font-weight:800}button{width:100%;padding:14px;margin:5px 0;border:0;border-radius:12px;font-weight:800;font-size:16px}.primary{background:#f2b705;color:#111}.ok{background:#30c36b;color:#08140d}.dark{background:#303036;color:#fff}input{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;margin:6px 0}</style></head><body><h1>🚴 Пивка — Курьер</h1><div id="login" class="card"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button class="primary" onclick="signIn()">Войти</button></div><div id="app" style="display:none"><div class="card"><b>Мои доставки</b><div class="muted">Только заказы, назначенные вам.</div></div><div id="orders"></div><button class="dark" onclick="load()">Обновить</button></div><script>const sb=supabase.createClient(window.PIVKA_CONFIG.supabaseUrl,window.PIVKA_CONFIG.supabaseAnonKey);async function signIn(){const r=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)return alert(r.error.message);login.style.display='none';app.style.display='block';load()}async function load(){const r=await sb.rpc('driver_my_deliveries');if(r.error)return alert(r.error.message);orders.innerHTML=(r.data||[]).map(x=>`<div class="card"><div class="muted">Заказ №${x.order_number}</div><div class="big">${x.customer_name||'Клиент'}</div><div>📞 ${x.customer_phone||''}</div><div>📍 ${x.address||'Адрес не указан'}</div><div class="big">${Number(x.total||0).toFixed(2)} ₾</div><hr><button class="dark" onclick="act('${x.assignment_id}','ACCEPT')">✓ Принял заказ</button><button class="dark" onclick="act('${x.assignment_id}','AT_PICKUP')">📦 Прибыл за заказом</button><button class="primary" onclick="act('${x.assignment_id}','ON_ROUTE')">🛵 В дороге</button><button class="dark" onclick="act('${x.assignment_id}','AT_CUSTOMER')">📍 Прибыл к клиенту</button><button class="ok" onclick="act('${x.assignment_id}','DELIVERED')">✓ Доставлено</button><button class="dark" onclick="fail('${x.assignment_id}')">⚠ Не удалось доставить</button></div>`).join('')||'<div class="card">Сейчас назначенных доставок нет.</div>'}async function act(id,a){const r=await sb.rpc('driver_set_delivery_status',{p_assignment:id,p_action:a});if(r.error)alert(r.error.message);else load()}async function fail(id){const reason=prompt('Почему не удалось доставить?');if(!reason)return;const r=await sb.rpc('driver_set_delivery_status',{p_assignment:id,p_action:'FAILED',p_reason:reason});if(r.error)alert(r.error.message);else load()}sb.auth.getSession().then(x=>{if(x.data.session){login.style.display='none';app.style.display='block';load()}})</script></body></html>
