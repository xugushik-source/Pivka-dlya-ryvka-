<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пивка — Курьер</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><style>body{margin:0;background:#0d0d0f;color:#fff;font:16px system-ui;padding:16px}h1{font-size:24px}.card{background:#19191d;border:1px solid #303036;border-radius:18px;padding:16px;margin:12px 0}.muted{color:#aaa}.big{font-size:22px;font-weight:800}button{width:100%;padding:14px;margin:5px 0;border:0;border-radius:12px;font-weight:800;font-size:16px}.primary{background:#f2b705;color:#111}.ok{background:#30c36b;color:#08140d}.dark{background:#303036;color:#fff}input{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;margin:6px 0}</style></head><body><h1>🚴 Пивка — Курьер</h1><div id="login" class="card"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button class="primary" onclick="signIn()">Войти</button></div><div id="app" style="display:none"><div class="card"><b>Статус</b><select id="availability" onchange="setAvailability()" style="width:100%;padding:12px;margin-top:8px;border-radius:12px;background:#111;color:#fff"><option value="AVAILABLE">🟢 Готов принимать</option><option value="BUSY">🟠 Занят</option><option value="BREAK">☕ Перерыв</option><option value="OFFLINE">⚫ Не работаю</option></select><button class="dark" onclick="openCash()">Открыть кассовую смену</button><button class="dark" onclick="closeCash()">Закрыть кассовую смену</button><div id="stats" class="muted"></div></div><div class="card"><b>Мои доставки</b><div class="muted">Только заказы, назначенные вам.</div></div><div id="orders"></div><button class="dark" onclick="load()">Обновить</button></div><script>const sb=supabase.createClient(window.PIVKA_CONFIG.supabaseUrl,window.PIVKA_CONFIG.supabaseAnonKey);async function issue(id){const type=prompt('Тип: NO_ANSWER / WRONG_ADDRESS / CUSTOMER_REFUSED / PAYMENT_PROBLEM / PRODUCT_PROBLEM / OTHER','NO_ANSWER');if(!type)return;const note=prompt('Комментарий','')||'';const r=await sb.rpc('driver_report_issue',{p_assignment:id,p_type:type,p_note:note});if(r.error)alert(r.error.message);else alert('Проблема передана диспетчеру')}async function today(){const r=await sb.rpc('driver_daily_summary');if(!r.error){const x=r.data||{};stats.innerHTML='Сегодня: '+(x.deliveries||0)+' доставок · '+(x.failed||0)+' неудачно · '+Number(x.cash||0).toFixed(2)+' ₾ наличными · '+Number(x.earnings||0).toFixed(2)+' ₾ заработок'}}async function startAttempt(id){const r=await sb.rpc('driver_start_attempt',{p_assignment:id});if(r.error)alert(r.error.message);else alert('Попытка доставки №'+r.data)}async function sendLocation(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(async p=>{await sb.rpc('driver_update_location',{p_lat:p.coords.latitude,p_lng:p.coords.longitude,p_accuracy:p.coords.accuracy})})}async function setAvailability(){const r=await sb.rpc('driver_set_availability',{p_status:availability.value});if(r.error)alert(r.error.message)}async function openCash(){const opening=Number(prompt('Наличные в начале смены','0')||0);const r=await sb.rpc('driver_open_cash',{p_opening:opening});if(r.error)alert(r.error.message);else alert('Кассовая смена открыта')}async function closeCash(){const actual=Number(prompt('Сколько наличных сейчас у вас?','0'));const r=await sb.rpc('driver_close_cash',{p_actual:actual});if(r.error)alert(r.error.message);else alert('Ожидалось '+Number(r.data.expected).toFixed(2)+' ₾; факт '+Number(r.data.actual).toFixed(2)+' ₾; разница '+Number(r.data.difference).toFixed(2)+' ₾')}async function signIn(){const r=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)return alert(r.error.message);login.style.display='none';app.style.display='block';load()}async function load(){const st=await sb.rpc('driver_stats');if(!st.error){const x=st.data||{};stats.innerHTML='Доставлено: '+(x.delivered||0)+' · Неудачно: '+(x.failed||0)+' · Заработок: '+Number(x.earnings||0).toFixed(2)+' ₾ · Наличные: '+Number(x.cash_collected||0).toFixed(2)+' ₾'}today();const r=await sb.rpc('driver_my_deliveries');if(r.error)return alert(r.error.message);orders.innerHTML=(r.data||[]).map(x=>`<div class="card"><div class="muted">Заказ №${x.order_number}</div><div class="big">${x.customer_name||'Клиент'}</div><div>📞 ${x.customer_phone||''}</div><div>📍 ${x.address||'Адрес не указан'}</div><div class="big">${Number(x.total||0).toFixed(2)} ₾</div><div style="margin:10px 0;padding:12px;border-radius:12px;background:#25252b"><b>ОПЛАТА: ${x.collection_status}</b><div class="muted">Способ заказа: ${x.payment_method||'не указан'} · оплачено ${Number(x.amount_paid||0).toFixed(2)} ₾ · долг ${Number(x.debt_amount||0).toFixed(2)} ₾</div></div><button class="ok" onclick="pay('${x.assignment_id}',${Number(x.total||0)})">💵 Оплачено</button><button class="dark" onclick="partial('${x.assignment_id}',${Number(x.total||0)})">◐ Частично оплачено</button><button class="dark" onclick="debt('${x.assignment_id}')">📕 В долг</button><hr><button class="dark" onclick="startAttempt('${x.assignment_id}')">▶ Начать попытку доставки</button><button class="dark" onclick="act('${x.assignment_id}','ACCEPT')">✓ Принял заказ</button><button class="dark" onclick="act('${x.assignment_id}','AT_PICKUP')">📦 Прибыл за заказом</button><button class="primary" onclick="act('${x.assignment_id}','ON_ROUTE')">🛵 В дороге</button><button class="dark" onclick="act('${x.assignment_id}','AT_CUSTOMER')">📍 Прибыл к клиенту</button><button class="ok" onclick="act('${x.assignment_id}','DELIVERED')">✓ Доставлено</button><button class="dark" onclick="issue('${x.assignment_id}')">🆘 Сообщить проблему</button><button class="dark" onclick="fail('${x.assignment_id}')">⚠ Не удалось доставить</button></div>`).join('')||'<div class="card">Сейчас назначенных доставок нет.</div>'}async function act(id,a){const r=await sb.rpc('driver_set_delivery_status',{p_assignment:id,p_action:a});if(r.error)alert(r.error.message);else load()}async function pay(id,total){const method=prompt('Как оплачено? CASH / BANK_LINK / TRANSFER / CARD','CASH')||'CASH';const r=await sb.rpc('driver_record_collection',{p_assignment:id,p_mode:'PAID',p_amount:total,p_method:method});if(r.error)alert(r.error.message);else load()}async function partial(id,total){const amount=Number(prompt('Сколько оплачено из '+total+' ₾?','0'));if(!amount)return;const method=prompt('Как оплачено? CASH / BANK_LINK / TRANSFER / CARD','CASH')||'CASH';const r=await sb.rpc('driver_record_collection',{p_assignment:id,p_mode:'PAID',p_amount:amount,p_method:method});if(r.error)alert(r.error.message);else load()}async function debt(id){const note=prompt('Кому/почему оставлен долг?');if(!note)return;const r=await sb.rpc('driver_record_collection',{p_assignment:id,p_mode:'DEBT',p_amount:0,p_method:'OTHER',p_note:note});if(r.error)alert(r.error.message);else load()}async function fail(id){const reason=prompt('Почему не удалось доставить?');if(!reason)return;const r=await sb.rpc('driver_set_delivery_status',{p_assignment:id,p_action:'FAILED',p_reason:reason});if(r.error)alert(r.error.message);else load()}setInterval(()=>{if(availability&&availability.value!=='OFFLINE')sendLocation()},60000);sb.auth.getSession().then(x=>{if(x.data.session){login.style.display='none';app.style.display='block';load()}})</script></body></html>
