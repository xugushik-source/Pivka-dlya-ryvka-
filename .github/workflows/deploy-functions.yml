# Deploys the Telegram bot (Supabase edge function «telegram») when it changes on main, or by hand:
# Actions → Deploy edge functions → Run workflow.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens); without it the job is skipped.
name: Deploy edge functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/telegram/**']
  workflow_dispatch:
concurrency: deploy-functions
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uphnuzgaildmjrttmbaq
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN is not set — skipping"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: |
          # telegram checks its callers itself (webhook secret / internal secret / staff JWT / Mini App initData) → no JWT check.
          supabase functions deploy telegram --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
