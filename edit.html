<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Изменить заказ — Пивка для рывка</title><meta name="theme-color" content="#080a0b">
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0b;color:#fff;font:15px system-ui,-apple-system,sans-serif}button,input{font:inherit}
.app{max-width:560px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 260px}
h1{font-size:24px;margin:4px 0 2px}.muted{color:#a9afb3;font-size:13px}.accent{color:#ffb51b}
.card{background:#14181a;border:1px solid #272d30;border-radius:16px;padding:12px 14px;margin:12px 0}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}.ghead b{color:#ffcf6b}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #23292c}
.line:first-of-type{border-top:0}.line .nm{overflow-wrap:anywhere}.line small{display:block;color:#a9afb3;font-size:12px;margin-top:2px}
.line.removed .nm{opacity:.45;text-decoration:line-through}
.step{display:flex;gap:6px;align-items:center}.step b{min-width:46px;text-align:center}
.step button,.mini{width:36px;height:36px;border:0;border-radius:10px;background:#262c2f;color:#fff;font-weight:900;font-size:18px}
.step .x{background:#3a1d1d;color:#ff9b9b}.mini{width:auto;height:auto;padding:7px 10px;font-size:13px;font-weight:800}
.warn{background:#2a1b09;border:1px solid #68420d;color:#ffd789;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.err{color:#ff7878;margin:10px 0}.ok{color:#8de3a8}
.yellow{border:0;border-radius:12px;background:#ffb51b;color:#171000;font-weight:900;padding:14px;width:100%}
.ghost{border:1px dashed #3a4145;background:none;color:#ffcf6b;border-radius:12px;padding:12px;width:100%;font-weight:800;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0d1011ee;border-top:1px solid #23292c;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:auto;display:grid;gap:8px}.sum{display:flex;justify-content:space-between;font-weight:900;font-size:17px}
#search{width:100%;background:#0d1011;border:1px solid #333b3f;color:#fff;border-radius:12px;padding:12px;margin:8px 0}
.choice{display:grid;gap:8px;margin-top:10px}.choice button{border:1px solid #3a4145;background:#191d1f;color:#fff;border-radius:12px;padding:12px;font-weight:800}
.gift{color:#d9dde0;font-size:13px;margin-top:4px}
[hidden]{display:none!important}
</style></head><body>
<main class="app">
<h1 id="title">Изменить заказ</h1>
<div class="muted" id="sub">Загрузка…</div>
<div id="box"></div>
</main>
<div class="bar" id="bar" hidden><div class="in">
<div class="sum"><span>Итого примерно</span><span id="sum"></span></div>
<div class="muted" id="sumNote">Подарок и доставка пересчитаются после сохранения</div>
<div id="writeoff" class="warn" hidden></div>
<div id="choice" hidden></div>
<button class="yellow" id="save" onclick="save()">Сохранить изменения</button>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<script>
// One page for three people: the customer (link from the order status card, before «Принят»), the courier or owner
// inside Telegram (Mini App, identity checked by the bot's signature) and the admin (logged-in admin session).
'use strict';
const qs = new URLSearchParams(location.search);
const ORDER = qs.get('o');
const TG_DATA = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData');
const MODE = TG_DATA ? 'tg' : qs.get('staff') ? 'staff' : 'customer';
const FN_URL = PIVKA_CONFIG.supabaseUrl + '/functions/v1/telegram';
const sb = window.supabase.createClient(PIVKA_CONFIG.supabaseUrl, PIVKA_CONFIG.supabaseAnonKey);
let view = null, lines = [], keepBundle = true, catalog = null, busy = false, charge = null;

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Number(n || 0).toFixed(2).replace('.00', '') + ' ₾';
const UNITS = { ru: [' л', ' шт'], ka: [' ლ', ' ც'], hy: [' լ', ' հատ'] };
const unitTxt = (q, u) => Number(q) + (UNITS[document.documentElement.lang] || UNITS.ru)[u === 'liter' ? 0 : 1];

async function api(items) {
  if (MODE === 'tg') {
    const init = window.Telegram?.WebApp?.initData || TG_DATA;
    const r = await fetch(FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'webapp_edit', init_data: init, order_id: ORDER, items, keep_bundle: keepBundle, charge }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) throw new Error(j.error || 'Не получилось');
    return j
  }
  const args = { p_order: ORDER };
  if (items) Object.assign(args, { p_items: items, p_keep_bundle: keepBundle }, MODE === 'staff' ? { p_charge: charge || 'DRIVER' } : {});
  const r = await sb.rpc(MODE === 'staff' ? 'order_edit_staff' : 'order_edit', args);
  if (r.error) throw new Error(r.error.message);
  return r.data
}

async function load() {
  try {
    if (!ORDER) throw new Error('Не указан заказ');
    view = await api(null);
    if (!view || !view.order_id) throw new Error('Заказ не найден');
  } catch (e) {
    $('sub').textContent = '';
    $('box').innerHTML = '<div class="err">' + esc(e.message === 'Forbidden' ? 'Войдите в админку и откройте ссылку снова' : e.message) + '</div>';
    return
  }
  lines = view.items.map(i => ({ ...i, qty: Number(i.qty), orig: Number(i.qty), min: Number(i.min), step: Number(i.step), price: Number(i.price) }));
  keepBundle = true;
  render()
}

const staffView = () => view.role !== 'CUSTOMER';
const poured = () => view.poured && staffView();

// Poured beer that would be taken back: the purchase cost is written off.
function writeoffSum() {
  if (!poured()) return 0;
  let s = 0;
  lines.forEach(l => { if (l.unit === 'liter' && l.qty < l.orig) s += (l.orig - l.qty) * Number(l.cost || 0) });
  if (!keepBundle && view.bundle) view.bundle.items.forEach(i => { if (i.unit === 'liter') s += Number(i.qty) * Number(i.cost || 0) });
  return Math.round(s * 100) / 100
}

function lineHtml(l, k) {
  const gone = l.qty <= 0;
  const beerLock = poured() && l.unit === 'liter' && l.qty < l.orig;
  return '<div class="line' + (gone ? ' removed' : '') + '"><div class="nm">' + esc(l.name) +
    '<small>' + money(l.price) + (l.unit === 'liter' ? ' за 1 л' : '') + (beerLock ? ' · <span class="accent">разлито ' + unitTxt(l.orig, 'liter') + '</span>' : '') + '</small></div>' +
    (gone ? '<button class="mini" onclick="setQty(' + k + ',' + l.min + ')">Вернуть</button>' :
      '<div class="step"><button onclick="dec(' + k + ')" aria-label="Меньше">−</button><b>' + unitTxt(l.qty, l.unit) + '</b>' +
      '<button onclick="inc(' + k + ')" aria-label="Больше">+</button><button class="x" onclick="setQty(' + k + ',0)" aria-label="Убрать">✕</button></div>') + '</div>'
}

function render() {
  const editable = view.editable;
  $('title').textContent = 'Заказ №' + view.order_number;
  $('sub').textContent = editable ? (MODE === 'customer' ? 'Можно менять, пока курьер не подтвердил заказ' : 'Менять можно до «Собран»') : '';
  let h = '';
  if (!editable) {
    h += '<div class="warn">' + (MODE === 'customer'
      ? 'Заказ уже принят курьером — изменить его можно, только позвонив курьеру.'
      : 'Заказ уже собран — менять поздно.') + '</div>';
    if (MODE === 'customer') h += '<a class="ghost" style="display:block;text-align:center;text-decoration:none" href="#" data-chat>💬 Напишите нам в чат</a>';
    $('box').innerHTML = h + backLink();
    $('bar').hidden = true;
    return
  }
  if (view.bundle) {
    h += '<div class="card"><div class="ghead"><b>🔥 Рывок</b>' + (keepBundle
      ? '<button class="mini" onclick="setBundle(false)">✕ Убрать рывок</button>'
      : '<button class="mini" onclick="setBundle(true)">Вернуть рывок</button>') + '</div>' +
      '<div class="muted"' + (keepBundle ? '' : ' style="text-decoration:line-through"') + '>' +
      view.bundle.items.map(i => esc(i.name) + ' × ' + unitTxt(i.qty, i.unit)).join(', ') + ' · ' + money(view.bundle.total) + '</div>' +
      '<div class="muted" style="margin-top:4px">Рывок меняется только целиком</div></div>'
  }
  if (staffView()) {
    // Grouped by supplier, so the courier sees whose part he changes.
    const groups = {};
    lines.forEach((l, k) => { const g = l.supplier || 'Без поставщика'; (groups[g] = groups[g] || []).push(k) });
    Object.keys(groups).forEach(g => {
      const any = groups[g].some(k => lines[k].qty > 0);
      h += '<div class="card"><div class="ghead"><b>' + esc(g) + '</b>' + (any ? '<button class="mini" onclick="clearGroup(\'' + esc(g).replace(/'/g, "\\'") + '\')">✕ всё</button>' : '') + '</div>' +
        groups[g].map(k => lineHtml(lines[k], k)).join('') + '</div>'
    })
  } else {
    h += '<div class="card"><div class="ghead"><b>Товары</b></div>' + lines.map(lineHtml).join('') + '</div>'
  }
  if (view.gifts?.length) h += '<div class="gift"><span>🎁 Подарок сейчас:</span> ' + view.gifts.map(g => esc(g.name) + ' × ' + unitTxt(g.qty, g.unit)).join(', ') + '</div>';
  h += '<button class="ghost" onclick="openAdd()">+ Добавить товар</button><div id="add"></div>' + backLink();
  $('box').innerHTML = h;
  $('bar').hidden = false;
  const goods = (keepBundle && view.bundle ? Number(view.bundle.total) : 0) + lines.reduce((s, l) => s + l.price * Math.max(l.qty, 0), 0);
  $('sum').textContent = money(goods + Number(view.delivery_fee || 0));
  const wo = writeoffSum();
  $('writeoff').hidden = !wo;
  if (wo) $('writeoff').innerHTML = '🍺 Пиво уже разлито. Убрать — <b>' + money(wo) + '</b> по закупу ' +
    (view.role === 'DRIVER' ? 'запишется на вас.' : view.driver ? 'запишется на курьера (или на вас — выберете при сохранении).' : 'спишется на владельца.');
  $('choice').hidden = true;
  $('save').disabled = busy
}

function backLink() {
  if (MODE === 'tg') return '<button class="ghost" onclick="Telegram.WebApp.close()">Закрыть</button>';
  if (MODE === 'staff') return '<a class="ghost" style="display:block;text-align:center;text-decoration:none" href="./admin/">← В админку</a>';
  return '<a class="ghost" style="display:block;text-align:center;text-decoration:none" href="./order.html?o=' + encodeURIComponent(ORDER) + '">← Вернуться к заказу</a>'
}

function setQty(k, q) { lines[k].qty = q; render() }
function inc(k) { const l = lines[k]; l.qty = l.qty <= 0 ? l.min : l.qty + l.step; render() }
function dec(k) { const l = lines[k]; l.qty = l.qty - l.step < l.min ? 0 : l.qty - l.step; render() }
function setBundle(v) { keepBundle = v; render() }
function clearGroup(g) { lines.forEach(l => { if ((l.supplier || 'Без поставщика') === g) l.qty = 0 }); render() }

async function openAdd() {
  const box = $('add');
  box.innerHTML = '<input id="search" placeholder="Найти товар" oninput="renderAdd()" autocomplete="off"><div id="addList" class="card"><div class="muted">Загрузка…</div></div>';
  if (!catalog) {
    const r = await sb.rpc('city_catalog', { p_city: view.city_id });
    catalog = r.error ? [] : r.data || [];
    // Night prices (00:00–08:00): an item added now is charged the night price, show the same.
    const n = await sb.rpc('night_pricing');
    if (!n.error && n.data?.active) {
      const st = Number(n.data.step || 0.5), k = 1 + Number(n.data.percent) / 100;
      catalog.forEach(p => { if (Number(p.sale_price) > 0) p.sale_price = Math.ceil(Math.round(p.sale_price * k / st * 1e6) / 1e6) * st })
    }
  }
  renderAdd();
  $('search').focus()
}
function renderAdd() {
  const q = ($('search')?.value || '').trim().toLowerCase();
  const list = catalog.filter(p => !q || String(p.name).toLowerCase().includes(q) || String(p.category_name || '').toLowerCase().includes(q)).slice(0, 40);
  $('addList').innerHTML = list.length ? list.map(p => '<div class="line"><div class="nm">' + esc(p.name) + '<small>' + money(p.sale_price) +
    (p.unit === 'liter' ? ' за 1 л' : '') + '</small></div><button class="mini" onclick="addProduct(\'' + p.id + '\')">Добавить</button></div>').join('')
    : '<div class="muted">Ничего не нашлось</div>'
}
function addProduct(id) {
  const k = lines.findIndex(l => l.product_id === id);
  if (k >= 0) { inc(k); return }
  const p = catalog.find(x => x.id === id);
  const min = Number(p.minimum_quantity || 1), step = Number(p.quantity_step || 1);
  lines.push({ product_id: p.id, name: p.name, unit: p.unit, qty: min, orig: 0, min, step, price: Number(p.sale_price), supplier: staffView() ? 'Новые товары' : null, cost: 0 });
  render()
}

async function save(chosen) {
  if (busy) return;
  const items = lines.filter(l => l.qty > 0).map(l => ({ product_id: l.product_id, quantity: l.qty }));
  const wo = writeoffSum();
  if (wo && view.role === 'DRIVER' && !confirm('Пиво уже разлито. Убрать — ' + money(wo) + ' запишется на вас. Подтвердить?')) return;
  if (wo && view.role === 'ADMIN' && view.driver && !chosen) {
    // Owner decides who pays for poured beer that is taken back.
    $('choice').hidden = false;
    $('choice').innerHTML = '<div class="choice"><div class="muted">Кто платит за разлитое пиво (' + money(wo) + ')?</div>' +
      '<button onclick="save(\'DRIVER\')">На курьера ' + esc(view.driver) + '</button><button onclick="save(\'OWNER\')">Списать на себя</button></div>';
    return
  }
  charge = chosen || 'DRIVER';
  busy = true; $('save').disabled = true; $('save').textContent = 'Сохраняем…';
  try {
    const r = await api(items);
    view = r; lines = view.items.map(i => ({ ...i, qty: Number(i.qty), orig: Number(i.qty), min: Number(i.min), step: Number(i.step), price: Number(i.price) }));
    keepBundle = true; busy = false; render();
    $('box').insertAdjacentHTML('afterbegin', '<div class="card ok"><span>' + (r.changed ? 'Сохранено.' : 'Ничего не изменилось.') + '</span> <span>Сумма: ' + money(r.total) + '</span></div>');
    window.scrollTo(0, 0)
  } catch (e) {
    busy = false; render();
    $('box').insertAdjacentHTML('afterbegin', '<div class="err">' + esc(e.message) + '</div>')
  }
  $('save').textContent = 'Сохранить изменения'
}

function boot() {
  if (MODE === 'tg' && window.Telegram?.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand() }
  load()
}
if (MODE === 'tg') {
  const s = document.createElement('script');
  s.src = 'https://telegram.org/js/telegram-web-app.js';
  s.onload = s.onerror = boot;
  document.head.appendChild(s)
} else boot();

// The customer sees the page in their language (same translations as the store).
window.setLang = l => { document.documentElement.lang = l };
</script>
<script src="./js/i18n.js?v=20261007i"></script><script src="./js/chat.js?v=20261007b"></script>
<script>
if (MODE === 'customer') {
  let l = 'ru';
  try { l = localStorage.getItem('pivka_lang') || (navigator.language || '').slice(0, 2) } catch (e) {}
  setLang(['ru', 'ka', 'hy'].includes(l) ? l : 'ru')
}
</script>
</body></html>
